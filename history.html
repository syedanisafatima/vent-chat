<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VC-Mood History</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Link to external CSS file -->
    <link rel="stylesheet" href="history.css">
</head>
<body>

    <div class="bg-landscape"></div>

    <!-- Sidebar Navigation -->
    <aside>
        <div>
            <div class="logo">VentChat</div>
            <ul class="nav-links">
                <li><a href="checkin.html">Check-In</a></li>
                <li><a href="journaling.html">Journal</a></li>
                <li><a href="breathing.html">Breathing</a></li>
                <li class="active"><a href="history.html">Mood History</a></li>
                <li><a href="resources.html">Resources</a></li>
            </ul>
        </div>
        <button class="logout-btn" onclick="handleLogout()">Logout</button>
    </aside>

    <!-- Main Content Area -->
    <main>
        <h1 class="header-title">Mood History</h1>

        <div class="dashboard-container">
            <!-- Top Controls -->
            <div class="chart-header">
                <span class="chart-title">Your Mood This Week</span>
                <div class="controls-row">
                    <div class="filter-tabs">
                        <button class="tab-btn active" onclick="setFilter(event, 'week')">Week</button>
                        <button class="tab-btn" onclick="setFilter(event, 'month')">Month</button>
                        <button class="tab-btn" onclick="setFilter(event, 'year')">Year</button>
                    </div>
                    <select class="dropdown-select" id="dateDropdown">
                        <option>June 2026</option>
                        <option>July 2026</option>
                    </select>
                </div>
            </div>

            <!-- Chart Box -->
            <div class="chart-body">
                <!-- Y-Axis Emojis -->
                <div class="y-axis">
                    <span>😁</span>
                    <span>😊</span>
                    <span>😐</span>
                    <span>🙁</span>
                    <span>😭</span>
                    <span>😡</span>
                </div>

                <!-- Vertical Bars Graph -->
                <div class="chart-grid">
                    <div class="bar-column">
                        <div class="bar" style="height: 130px;"></div>
                        <span class="day-label">Mon</span>
                    </div>
                    <div class="bar-column">
                        <div class="bar" style="height: 100px;"></div>
                        <span class="day-label">Tue</span>
                    </div>
                    <div class="bar-column">
                        <div class="bar" style="height: 155px;"></div>
                        <span class="day-label">Wed</span>
                    </div>
                    <div class="bar-column">
                        <div class="bar" style="height: 115px;"></div>
                        <span class="day-label">Thu</span>
                    </div>
                    <div class="bar-column">
                        <div class="bar" style="height: 140px;"></div>
                        <span class="day-label">Fri</span>
                    </div>
                    <div class="bar-column">
                        <div class="bar" style="height: 170px;"></div>
                        <span class="day-label">Sat</span>
                    </div>
                    <div class="bar-column">
                        <div class="bar" style="height: 125px;"></div>
                        <span class="day-label">Sun</span>
                    </div>
                </div>
            </div>

            <!-- Bottom Metrics Cards -->
            <div class="summary-row">
                <div class="summary-card">
                    <span class="summary-title">Average Mood</span>
                    <div class="summary-content">
                        <span class="summary-value">Normal</span>
                        <span style="font-size: 20px;">😐</span>
                    </div>
                </div>
                <div class="summary-card">
                    <span class="summary-title">Best Day</span>
                    <div class="summary-content">
                        <span class="summary-value date">June 15</span>
                        <span class="trophy-icon">🏆</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Link to external JavaScript file -->
    <script src="history.js"></script>
</body>
</html>
