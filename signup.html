<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VC-Sign Up</title>
    <link rel="stylesheet" href="auth-style.css">
</head>
<body>
    <div class="auth-card">
        <h1 class="auth-title">Let's Get Started!</h1>
        
        <form id="signupForm">
            <div class="input-group">
                <label for="username">👤Choose a Username</label>
                <input type="text" id="username" placeholder="choose_username" required>
            </div>
<div class="input-group">
    <label for="email">📧 Email Address</label>
    <input type="email" id="email" placeholder="you@example.com" required>
</div>
            <div class="input-group">
                <label for="password">🔑Create a Password</label>
                <input type="password" id="password" placeholder="****** At least 6 characters" required>
            </div>

            <button type="submit" class="auth-btn">Sign Up</button>
        </form>

        <div class="switch-auth">
            Already a user? <a href="login.html">Log In</a>
        </div>
        
        <div class="footer-text">© 2026 VentChat</div>
    </div>
<script type="module" src="signup.js"></script>
    
</body>
</html>
